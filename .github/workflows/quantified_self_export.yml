name: Quantified Self Daily Export

on:
  workflow_dispatch: # Enables the manual "Run workflow" button in the Actions UI
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC corresponds to 09:00 AM BST

jobs:
  generate_and_upload_csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Execute Export Script
        # If you are calling the generator function from within your main app loop, 
        # change the target below to 'src/main.py'[cite: 1].
        run: python src/quantified_self_exporter.py
        env:
          # Ensure any required environment variables for Google Drive and Garmin 
          # are mapped from your repository secrets, matching your .env.example structure[cite: 1].
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
