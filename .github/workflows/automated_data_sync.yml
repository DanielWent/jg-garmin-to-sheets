name: Auto Sync - Data

on:
  schedule:
    # Morning targets (06:45, 07:15, 07:45, 08:15, 08:45, 09:15 UK time)
    # Covers GMT (UTC+0) and BST (UTC+1) candidates:
    - cron: '45 5 * * *'       # 05:45 UTC -> 06:45 BST
    - cron: '15,45 6-8 * * *'  # 06:15–08:45 UTC -> covers middle morning runs in both GMT & BST
    - cron: '15 9 * * *'       # 09:15 UTC -> 09:15 GMT

    # Evening targets (18:00, 18:30, 19:00, 19:30, 20:00 UK time)
    # Covers GMT (UTC+0) and BST (UTC+1) candidates:
    - cron: '0,30 17-19 * * *' # 17:00–19:30 UTC -> covers 18:00–20:00 in BST and 18:00–19:30 in GMT
    - cron: '0 20 * * *'       # 20:00 UTC -> 20:00 GMT
  workflow_dispatch:

concurrency:
  group: garmin-sync-lock
  cancel-in-progress: false

jobs:
  check-window:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Evaluate Europe/London Time
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual execution detected. Proceeding."
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Calculate current local minute of the day (0–1439) in Europe/London
          LOCAL_H=$(TZ="Europe/London" date +%-H)
          LOCAL_M=$(TZ="Europe/London" date +%-M)
          LOCAL_MINS=$(( LOCAL_H * 60 + LOCAL_M ))
          LOCAL_TIME=$(TZ="Europe/London" date +"%H:%M")
          echo "Current Europe/London local time: $LOCAL_TIME ($LOCAL_MINS mins since midnight)"

          # Morning targets: 06:45 (405m) to 09:15 (555m).
          # Gate window (395m–575m / 06:35–09:35) accepts target runs while tolerating GitHub Actions runner queue jitter.
          # Evening targets: 18:00 (1080m) to 20:00 (1200m).
          # Gate window (1065m–1220m / 17:45–20:20) accepts target runs while ignoring off-season runs (17:30 GMT or 20:30 BST).
          if [ "$LOCAL_MINS" -ge 395 ] && [ "$LOCAL_MINS" -le 575 ]; then
            echo "Within morning window (06:45–09:15 UK). Proceeding."
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif [ "$LOCAL_MINS" -ge 1065 ] && [ "$LOCAL_MINS" -le 1220 ]; then
            echo "Within evening window (18:00–20:00 UK). Proceeding."
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "Outside target sync times for current UK timezone. Skipping."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  sync:
    needs: check-window
    if: needs.check-window.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Pre-Flight Check (Google Drive)
        id: preflight
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          USER1_DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          USER2_DRIVE_FOLDER_ID: ${{ secrets.USER2_DRIVE_FOLDER_ID }}
        run: python pre_flight_check.py

      - name: Evaluate Evening Force Sync
        id: sync-flags
        run: |
          LOCAL_HOUR=$(TZ="Europe/London" date +%-H)
          if [ "$LOCAL_HOUR" -ge 18 ]; then
            echo "Current UK time is >= 18:00 ($LOCAL_HOUR:xx). Forcing sync regardless of spreadsheet data."
            echo "run_user1=true" >> $GITHUB_OUTPUT
            echo "run_user2=true" >> $GITHUB_OUTPUT
          else
            echo "Using standard pre-flight outputs."
            echo "run_user1=${{ steps.preflight.outputs.run_user1 }}" >> $GITHUB_OUTPUT
            echo "run_user2=${{ steps.preflight.outputs.run_user2 }}" >> $GITHUB_OUTPUT
          fi

      - name: Set Sync Parameters
        if: steps.sync-flags.outputs.run_user1 == 'true' || steps.sync-flags.outputs.run_user2 == 'true'
        id: sync-params
        run: |
          export TZ="Europe/London"
          echo "start_date=$(date -d "3 days ago" +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "end_date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Connect to Tailscale
        if: steps.sync-flags.outputs.run_user1 == 'true' || steps.sync-flags.outputs.run_user2 == 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Route Traffic through Exit Node (With Retries)
        if: steps.sync-flags.outputs.run_user1 == 'true' || steps.sync-flags.outputs.run_user2 == 'true'
        run: |
          echo "Attempting to route through Tailscale exit node..."
          for i in {1..3}; do
            if sudo tailscale set --exit-node=${{ secrets.TAILSCALE_EXIT_NODE }} --exit-node-allow-lan-access=true --accept-routes --accept-dns=false; then
              echo "Successfully connected to exit node."
              exit 0
            fi
            echo "Attempt $i failed. Waiting 15 seconds before retrying..."
            sleep 15
          done
          echo "CRITICAL: Could not connect to the exit node after 3 attempts."
          exit 1

      - name: Restore Garmin Sessions Cache
        if: steps.sync-flags.outputs.run_user1 == 'true' || steps.sync-flags.outputs.run_user2 == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.garth_encrypted
          key: garmin-sessions-${{ github.run_id }}
          restore-keys: |
            garmin-sessions-

      - name: Decrypt Garmin Sessions
        if: steps.sync-flags.outputs.run_user1 == 'true' || steps.sync-flags.outputs.run_user2 == 'true'
        env:
          GARMIN_SESSION_KEY: ${{ secrets.GARMIN_SESSION_KEY }}
        run: |
          encPath="$HOME/.garth_encrypted/sessions.tar.enc"
          if [ -n "$GARMIN_SESSION_KEY" ] && [ -f "$encPath" ]; then
              openssl enc -aes-256-cbc -d -pbkdf2 -iter 100000 -in "$encPath" -out sessions.tar -k "$GARMIN_SESSION_KEY"
              garthDir="$HOME/.garth"
              mkdir -p "$garthDir"
              tar -xf sessions.tar -C "$garthDir"
              echo "Session cache restored."
          fi

      - name: Run Sync Script (USER1)
        if: steps.sync-flags.outputs.run_user1 == 'true'
        env:
          USER1_GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          USER1_GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          USER1_DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          USER1_NAME: ${{ secrets.USER1_NAME }}
          USER1_DOB: ${{ secrets.USER1_DOB }}
          USER1_GENDER: ${{ secrets.USER1_GENDER }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: "INFO"
        run: |
          python -m src.main cli-sync --start-date "${{ steps.sync-params.outputs.start_date }}" --end-date "${{ steps.sync-params.outputs.end_date }}" --profile USER1 --output-type drive --data-type "summary"

      - name: Run Sync Script (USER2)
        if: steps.sync-flags.outputs.run_user2 == 'true'
        env:
          USER2_GARMIN_EMAIL: ${{ secrets.USER2_GARMIN_EMAIL }}
          USER2_GARMIN_PASSWORD: ${{ secrets.USER2_GARMIN_PASSWORD }}
          USER2_DRIVE_FOLDER_ID: ${{ secrets.USER2_DRIVE_FOLDER_ID }}
          USER2_NAME: ${{ secrets.USER2_NAME }}
          USER2_DOB: ${{ secrets.USER2_DOB }}
          USER2_GENDER: ${{ secrets.USER2_GENDER }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: "INFO"
        run: |
          python -m src.main cli-sync --start-date "${{ steps.sync-params.outputs.start_date }}" --end-date "${{ steps.sync-params.outputs.end_date }}" --profile USER2 --output-type drive --data-type "summary"

      - name: Encrypt Garmin Sessions
        if: always() && (steps.sync-flags.outputs.run_user1 == 'true' || steps.sync-flags.outputs.run_user2 == 'true')
        env:
          GARMIN_SESSION_KEY: ${{ secrets.GARMIN_SESSION_KEY }}
        run: |
          garthDir="$HOME/.garth"
          if [ -n "$GARMIN_SESSION_KEY" ] && [ -d "$garthDir" ]; then
              tar -cf sessions.tar -C "$garthDir" .
              encDir="$HOME/.garth_encrypted"
              mkdir -p "$encDir"
              openssl enc -aes-256-cbc -salt -pbkdf2 -iter 100000 -in sessions.tar -out "$encDir/sessions.tar.enc" -k "$GARMIN_SESSION_KEY"
          fi

      - name: Save Garmin Sessions Cache
        if: always() && (steps.sync-flags.outputs.run_user1 == 'true' || steps.sync-flags.outputs.run_user2 == 'true')
        uses: actions/cache/save@v4
        with:
          path: ~/.garth_encrypted
          key: garmin-sessions-${{ github.run_id }}
